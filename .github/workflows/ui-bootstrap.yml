name: Bootstrap console javascript

on:
  push:
    branches: [main]
    paths:
      - '.ui-bootstrap/**'
      - '.github/workflows/ui-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .ui-bootstrap/js0 .ui-bootstrap/js1 .ui-bootstrap/js2 .ui-bootstrap/js3 > internal/webui/web/app.js
          node --check internal/webui/web/app.js
          rm -rf .ui-bootstrap
          rm -f .github/workflows/ui-bootstrap.yml
      - name: Commit normal source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add support operations console interactions"
          git push
