name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: innaware_support_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      INNAWARE_TEST_MYSQL_DSN: "root:rootpass@tcp(127.0.0.1:3306)/innaware_support_ci?parseTime=true&loc=UTC&charset=utf8mb4"
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n deploy/*.sh
      - name: Validate technician console JavaScript
        run: node --check internal/webui/web/app.js
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o dist/innaware-support-server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: innaware-support-server-linux-amd64
          path: dist/innaware-support-server

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore agent/InnAwareSupport.Agent.csproj
      - name: Publish Windows x64 single-file agent
        run: dotnet publish agent/InnAwareSupport.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/agent
      - name: Normalize artifact filename
        shell: pwsh
        run: |
          Copy-Item dist/agent/InnAwareSupport.exe dist/InnAware-Remote-Support.exe
          Get-FileHash dist/InnAware-Remote-Support.exe -Algorithm SHA256 | Format-List
      - name: Verify Windows product identity
        shell: pwsh
        run: |
          $path = Resolve-Path 'dist/InnAware-Remote-Support.exe'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
          Write-Host "ProductName:       $($info.ProductName)"
          Write-Host "CompanyName:       $($info.CompanyName)"
          Write-Host "FileDescription:   $($info.FileDescription)"
          Write-Host "FileVersion:       $($info.FileVersion)"
          Write-Host "ProductVersion:    $($info.ProductVersion)"
          if ($info.ProductName -ne 'InnAware Remote Support') {
            throw "Unexpected ProductName: $($info.ProductName)"
          }
          if ($info.CompanyName -ne 'InnAware') {
            throw "Unexpected CompanyName: $($info.CompanyName)"
          }
          if ($info.FileDescription -ne 'Attended remote support client for InnAware support sessions') {
            throw "Unexpected FileDescription: $($info.FileDescription)"
          }
          $signature = Get-AuthenticodeSignature $path
          Write-Host "Authenticode:      $($signature.Status)"
          if ($signature.SignerCertificate) {
            Write-Host "Signer subject:    $($signature.SignerCertificate.Subject)"
          } else {
            Write-Host "Signer subject:    (not signed yet)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: InnAware-Remote-Support-Windows-x64
          path: dist/InnAware-Remote-Support.exe

  preview-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, windows-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InnAware-Remote-Support-Windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mvp-latest
          name: InnAware Support MVP (latest main build)
          prerelease: true
          make_latest: false
          files: release/InnAware-Remote-Support.exe
